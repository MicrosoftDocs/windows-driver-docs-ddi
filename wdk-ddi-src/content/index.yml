### YamlMime:Hub

title: API reference documentation for Windows Driver Kit (WDK)
summary: The Windows driver API reference documentation provides detailed information about the Windows Driver Kit, driver frameworks, and driver development tools. Windows Driver Kit (WDK) 10 is integrated with Microsoft Visual Studio and Debugging Tools for Windows. This integrated environment gives you the tools you need to develop, build, package, deploy, test, and debug Windows drivers. WDK includes templates for several technologies and driver models, including Windows Driver Frameworks (WDF), Universal Serial Bus (USB), print, networking, and file system filters.
